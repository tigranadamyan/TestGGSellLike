# ===================================================
# Digital Goods Store — полный локальный стек
#   docker compose up -d --build           # app + postgres + redis + horizon
#   docker compose --profile tunnel up -d  # то же + публичный Cloudflare-туннель
# ===================================================

x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:6ID2rdeyVpb53PWzxsP8DGgVEBP0elOOx64hmgVYPzU=
  APP_URL: http://localhost:8080
  # Явно: без этого Laravel берёт DB_CONNECTION=sqlite из .env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: digital_goods
  DB_USERNAME: dgs_user
  DB_PASSWORD: dgs_secret
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CLIENT: phpredis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  BROADCAST_CONNECTION: reverb
  # The server publishes to Reverb over the compose network; browsers reach it
  # through the proxy on the public origin instead.
  REVERB_APP_ID: "966429"
  REVERB_APP_KEY: rblaz8jwzxsbrhqrhkhp
  REVERB_APP_SECRET: dhn7xzxqpzhwnvlelypw
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  # The built-in server handles one request at a time without this.
  PHP_CLI_SERVER_WORKERS: "4"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgs_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    command: >
      sh -c "php artisan config:clear &&
             php artisan migrate --force &&
             php artisan l5-swagger:generate &&
             php -S 0.0.0.0:8000 -t public server.php"
    ports:
      - "8000:8000"
    networks:
      - dgs

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgs_horizon
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    command: sh -c "php artisan config:clear && php artisan horizon"
    restart: unless-stopped
    networks:
      - dgs

  postgres:
    image: postgres:16-alpine
    container_name: dgs_postgres
    environment:
      POSTGRES_DB: digital_goods
      POSTGRES_USER: dgs_user
      POSTGRES_PASSWORD: dgs_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgs_user -d digital_goods"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dgs

  redis:
    image: redis:7-alpine
    container_name: dgs_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dgs

  # Публичный URL без домена и авторизации: docker compose --profile tunnel up -d
  # Адрес смотреть в: docker compose logs tunnel | grep trycloudflare.com
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dgs_tunnel
    profiles: ["tunnel"]
    depends_on:
      - proxy
    command: tunnel --no-autoupdate --url http://proxy:80
    restart: unless-stopped
    networks:
      - dgs

  # Broadcast server for the live storefront.
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgs_reverb
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    command: sh -c "php artisan config:clear && php artisan reverb:start --host=0.0.0.0 --port=8080"
    restart: unless-stopped
    networks:
      - dgs

  # Runs the every-minute sweep that releases expired reservations. Without it
  # a held key never returns to the storefront.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgs_scheduler
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    command: sh -c "php artisan config:clear && php artisan schedule:work"
    restart: unless-stopped
    networks:
      - dgs

  # Single origin for HTTP and WebSocket, so the tunnel can carry both.
  proxy:
    image: nginx:1.27-alpine
    container_name: dgs_proxy
    depends_on:
      - app
      - reverb
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - dgs

volumes:
  pgdata:

networks:
  dgs:
