# One public origin for both the app and the WebSocket server, so real-time
# updates survive the Cloudflare tunnel (a quick tunnel forwards a single URL).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# cloudflared reaches nginx over plain HTTP, so $scheme is always "http" here.
# Overwriting X-Forwarded-Proto with it told Laravel the request was insecure and
# every asset URL came back as http:// on an https:// page — blocked as mixed
# content. Keep whatever the edge already told us; fall back to $scheme only for
# direct hits on localhost.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream app_upstream    { server app:8000; }
upstream reverb_upstream { server reverb:8080; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Reverb's browser endpoint. /apps/* (the server-side publish API) stays
    # internal and is deliberately not exposed here.
    location /app {
        proxy_pass http://reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }
}
